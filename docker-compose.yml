version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: englishweb_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: english_lms
      MYSQL_USER: lms_user
      MYSQL_PASSWORD: lms_password_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: englishweb_livekit
    restart: always
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50050:50000-50050/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml

  redis:
    image: redis:7-alpine
    container_name: englishweb_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: englishweb_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: "mysql://lms_user:lms_password_123@mysql:3306/english_lms"
      JWT_SECRET: "your_super_secret_jwt_key_2026"
      JWT_REFRESH_SECRET: "your_super_secret_refresh_key_2026"
      LIVEKIT_API_KEY: "API_KEY_DEV"
      LIVEKIT_API_SECRET: "API_SECRET_DEV_ENGLISHWEB_2026"
      LIVEKIT_URL: "ws://livekit:7880"
    depends_on:
      mysql:
        condition: service_healthy
      livekit:
        condition: service_started

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: englishweb_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001/api"
      NEXT_PUBLIC_LIVEKIT_URL: "ws://localhost:7880"
    depends_on:
      - server

volumes:
  mysql_data:
  redis_data:
